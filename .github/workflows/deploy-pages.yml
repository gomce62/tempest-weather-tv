name: Deploy Web Dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'google-sites-embed.html'
      - 'public/manifest.webmanifest'
      - 'public/sw.js'
      - 'public/icons/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage GitHub Pages site
        run: |
          mkdir -p _site/icons
          cp google-sites-embed.html _site/index.html
          cp public/manifest.webmanifest _site/manifest.webmanifest
          cp public/sw.js _site/sw.js
          cp public/icons/*.png _site/icons/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Wait for artifact indexing
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
